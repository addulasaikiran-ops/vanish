name: CI

on:
  push:
    branches:
      - upgrade-v2
      - upgrade-v2-step1-work
  pull_request:
    branches:
      - upgrade-v2
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
